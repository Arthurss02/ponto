# docker compose up -d   ->  http://IP-DO-SERVIDOR:8095/
services:
  ponto:
    build: .
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      TZ: America/Sao_Paulo
      # numa VPS isto e obrigatorio. Troque por uma senha sua.
      PONTO_SENHA: troque-esta-senha
      # mandar os turnos daqui pra um Ponto central (opcional)
      # PONTO_ENVIAR_PARA: https://ponto.seudominio.com
      # PONTO_ENVIAR_SENHA: senha-do-central
      # PONTO_NOME: vps
    volumes:
      - ./dados:/dados
